name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: server
        run: node --check src/index.js && find src -name '*.js' -print0 | xargs -0 -n1 node --check
